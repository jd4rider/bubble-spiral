<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="icon" width="1024" height="1024"></canvas>
    <script>
      // Bubble Spiral app icon: a beaded spiral of glossy marbles over a dark
      // indigo tile, with the hole waiting at the centre.
      const canvas = document.getElementById('icon')
      const ctx = canvas.getContext('2d')
      const SIZE = 1024
      const C = SIZE / 2

      const rounded = new Path2D()
      const pad = 56
      const rad = 190
      rounded.roundRect(pad, pad, SIZE - pad * 2, SIZE - pad * 2, rad)

      ctx.save()
      ctx.clip(rounded)
      const bg = ctx.createLinearGradient(0, 0, SIZE, SIZE)
      bg.addColorStop(0, '#241a5c')
      bg.addColorStop(0.55, '#141033')
      bg.addColorStop(1, '#0a0f24')
      ctx.fillStyle = bg
      ctx.fillRect(0, 0, SIZE, SIZE)

      // Soft vignette so the beads read against the tile.
      const glow = ctx.createRadialGradient(C, C * 0.86, 40, C, C, SIZE * 0.72)
      glow.addColorStop(0, 'rgba(129,140,248,0.30)')
      glow.addColorStop(1, 'rgba(10,15,36,0)')
      ctx.fillStyle = glow
      ctx.fillRect(0, 0, SIZE, SIZE)

      const palette = ['#f472b6', '#fbbf24', '#34d399', '#38bdf8', '#a78bfa', '#fb7185']
      const R0 = 96
      const GROWTH = 27
      const STEP = 0.2
      const TURNS = 12.6

      function marble(x, y, r, color) {
        const g = ctx.createRadialGradient(x - r * 0.32, y - r * 0.38, r * 0.12, x, y, r)
        g.addColorStop(0, '#ffffff')
        g.addColorStop(0.22, color)
        g.addColorStop(0.82, color)
        g.addColorStop(1, 'rgba(0,0,0,0.45)')

        ctx.beginPath()
        ctx.arc(x, y, r, 0, Math.PI * 2)
        ctx.fillStyle = g
        ctx.shadowColor = 'rgba(0,0,0,0.45)'
        ctx.shadowBlur = 18
        ctx.shadowOffsetY = 8
        ctx.fill()
        ctx.shadowColor = 'transparent'
        ctx.shadowBlur = 0
        ctx.shadowOffsetY = 0

        ctx.beginPath()
        ctx.arc(x - r * 0.3, y - r * 0.36, r * 0.2, 0, Math.PI * 2)
        ctx.fillStyle = 'rgba(255,255,255,0.85)'
        ctx.fill()
      }

      let index = 0
      for (let theta = 0; theta < TURNS; theta += STEP) {
        const radius = R0 + GROWTH * theta
        const angle = -Math.PI / 2 + theta
        const x = C + Math.cos(angle) * radius
        const y = C + Math.sin(angle) * radius
        const taper = 0.62 + 0.38 * (radius / (R0 + GROWTH * TURNS))
        marble(x, y, 44 * taper, palette[index % palette.length])
        index += 1
      }

      // The hole the chain is trying to reach.
      ctx.beginPath()
      ctx.arc(C, C, 58, 0, Math.PI * 2)
      ctx.fillStyle = '#070a16'
      ctx.fill()
      ctx.lineWidth = 12
      ctx.strokeStyle = 'rgba(248,113,113,0.9)'
      ctx.shadowColor = 'rgba(248,113,113,0.75)'
      ctx.shadowBlur = 40
      ctx.stroke()
      ctx.restore()

      ctx.save()
      ctx.lineWidth = 10
      ctx.strokeStyle = 'rgba(255,255,255,0.10)'
      ctx.stroke(rounded)
      ctx.restore()
    </script>
  </body>
</html>
